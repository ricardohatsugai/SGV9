services:
  # Banco de dados MySQL 8.4 LTS
  db:
    image: mysql:8.4
    container_name: sgv9_mysql
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: ${TZ:-America/Sao_Paulo}

    ports:
      - "${MYSQL_PORT:-3306}:3306"

    volumes:
      - ./init-scripts/01-ddl.sql:/docker-entrypoint-initdb.d/01-ddl.sql:ro
      - ./init-scripts/02-dml.sql:/docker-entrypoint-initdb.d/02-dml.sql:ro
      - mysqldata:/var/lib/mysql

    networks:
      - sgv9_net

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD} --silent"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # phpMyAdmin
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: sgv9_phpmyadmin
    restart: unless-stopped

    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: ${MYSQL_USER}
      PMA_PASSWORD: ${MYSQL_PASSWORD}

    ports:
      - "${PHPMYADMIN_PORT:-8080}:80"

    depends_on:
      db:
        condition: service_healthy

    networks:
      - sgv9_net

  # Servidor web Nginx
  web:
    image: nginx:alpine
    container_name: sgv9_nginx
    restart: unless-stopped

    ports:
      - "${WEB_PORT:-80}:80"

    volumes:
      - ./backend:/var/www/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

    depends_on:
      - php

    networks:
      - sgv9_net

  # Processador PHP-FPM
  php:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: sgv9_php
    restart: unless-stopped

    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${MYSQL_DATABASE}
      DB_USERNAME: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      TZ: ${TZ:-America/Sao_Paulo}

    volumes:
      - ./backend:/var/www/html

    depends_on:
      db:
        condition: service_healthy

    networks:
      - sgv9_net

networks:
  sgv9_net:
    driver: bridge

volumes:
  mysqldata: